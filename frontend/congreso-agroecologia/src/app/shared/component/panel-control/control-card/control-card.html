<!-- User Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_4px_24px_rgba(0,0,0,0.02)] border border-outline-variant/10 group hover:shadow-[0_8px_32px_rgba(0,0,0,0.06)] transition-all">
  <div class="flex flex-col md:flex-row md:items-center gap-8">
    <div class="flex-1 space-y-4">
      <div class="flex items-center gap-4">
        <div>
          <div class="flex items-center gap-2">
            <h4 class="text-xl font-bold text-on-surface">{{ user.nombre }} {{ user.apellido }}</h4>
            <span class="bg-surface-container px-2 py-0.5 rounded text-[10px] font-bold text-primary tracking-tighter">USR-{{ user.id }}</span>
          </div>
          <p class="text-sm text-on-surface-variant">
            {{ user.tipoIdentificacion || 'Identificación' }}:
            {{ user.numeroIdentificacion || 'Sin informar' }}
          </p>
        </div>
      </div>
      <p class="text-xs text-outline font-medium">{{ user.email }}</p>
    </div>

    <div class="flex flex-row flex-wrap gap-2 justify-end">
      <button
        type="button"
        class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [ngClass]="permisos.esActivo ? estilos.activo : estilos.inactivo"
        [disabled]="guardando"
        (click)="cambiarActivo()">
        {{ permisos.esActivo ? 'ACTIVO' : 'INACTIVO' }}
      </button>
    </div>

    <div class="flex flex-row flex-wrap gap-2 justify-end">
      <button type="button" class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [ngClass]="permisos.esAdmin ? estilos.activo : estilos.inactivo"
        [disabled]="guardando"
        (click)="cambiarPermiso(TipoRol.ADMIN)">
        Administrador
      </button>

      <button type="button" class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [ngClass]="permisos.esEvaluador ? estilos.activo : estilos.inactivo"
        [disabled]="guardando"
        (click)="cambiarPermiso(TipoRol.EVALUADOR)">
        Evaluador
      </button>

      <button type="button" class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [ngClass]="permisos.esOrganizador ? estilos.activo : estilos.inactivo"
        [disabled]="guardando"
        (click)="cambiarPermiso(TipoRol.OC)">
        Organizador Científico
      </button>
    </div>
  </div>

  @if (cambios) {
    <div class="flex flex-row gap-2 justify-end mt-6">
      <button type="button" class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [disabled]="guardando"
        (click)="cancelar()">
        Cancelar
      </button>

      <button type="button"
        class="px-4 py-2 rounded-lg text-xs font-bold transition-all bg-primary text-on-primary shadow-sm hover:scale-105 active:scale-95 disabled:opacity-50"
        [disabled]="guardando"
        (click)="guardar()">
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  }

  @if (mensajeError) {
    <div class="flex justify-center mt-4">
      <span class="text-red-700">{{ mensajeError }}</span>
    </div>
  }
</div>
