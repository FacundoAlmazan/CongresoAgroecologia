<div class="bg-surface-container-lowest p-6 md:p-8 rounded-xl shadow-[0_8px_32px_rgba(23,29,20,0.02)] flex flex-col md:flex-row md:items-center justify-between gap-8 group hover:shadow-lg transition-all duration-300"
     [ngClass]="configEstado.claseCard">
  
  <div class="flex-1 space-y-2">
    <div class="flex items-center gap-3 mb-1">
      <span class="text-tertiary font-bold tracking-wider text-xs uppercase bg-tertiary-fixed/20 px-2 py-0.5 rounded">
        {{ trabajo.id }}
      </span>
      
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold" 
           [ngClass]="configEstado.claseBadge">
        <span class="material-symbols-outlined text-sm" 
              [style.font-variation-settings]="configEstado.estiloIcono || ''">
          {{ configEstado.icono }}
        </span>
        {{ configEstado.texto }}
      </div>
    </div>
    
    <h3 class="text-xl font-bold text-on-surface group-hover:text-primary transition-colors">
      {{ trabajo.titulo }}
    </h3>
  </div>

  <div class="flex flex-wrap items-center gap-3">
    <button [hidden]="!edit" (click)="editar()" 
            class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-container-low text-primary hover:bg-surface-container-high transition-colors font-bold">
      <span class="material-symbols-outlined text-sm">edit_note</span>
      Editar entrega
    </button>

    

    <button 
            class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-container-low text-primary hover:bg-surface-container-high transition-colors font-bold">
      <span class="material-symbols-outlined">forum</span>
      Ver Devoluciones 
    </button>
  </div>

</div>
