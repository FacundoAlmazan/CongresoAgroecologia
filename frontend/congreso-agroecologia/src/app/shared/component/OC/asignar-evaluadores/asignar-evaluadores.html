
<main class="flex-grow max-w-[1440px] w-full mx-auto px-8 py-12">
<!-- Header Section -->
<div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-12">
<div class="max-w-2xl">

<h1 class="text-5xl font-bold text-primary leading-tight">Trabajos y Asignaciones</h1>
</div>
<button class="flex items-center gap-2 px-6 py-3 bg-surface-container-high text-primary rounded-lg font-semibold hover:bg-surface-container-highest transition-all duration-200">
<span class="material-symbols-outlined text-sm">history</span>
                Ver historial de cambios
            </button>
</div>
<!-- Dashboard Controls -->
<div class="flex flex-col md:flex-row gap-8 mb-8 items-center justify-between">
<div class="flex items-center gap-3 w-full md:w-auto">
<div class="relative group flex-grow md:w-80">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/30 focus:bg-surface-container-lowest transition-all" placeholder="Buscar por código o título..." type="text"/>
</div>
<button class="p-3 bg-surface-container-low text-primary rounded-lg hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">filter_list</span>
</button>
<button class="p-3 bg-primary text-on-primary rounded-lg hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined">search</span>
</button>
</div>
<div class="flex p-1 bg-surface-container-low rounded-xl w-full md:w-auto">
<button class="px-8 py-2.5 rounded-lg bg-surface-container-lowest text-primary font-bold shadow-sm">Asignar</button>
<button class="px-8 py-2.5 rounded-lg text-on-surface-variant font-medium hover:text-primary transition-colors">Aceptados</button>
<button class="px-8 py-2.5 rounded-lg text-on-surface-variant font-medium hover:text-primary transition-colors">Rechazados</button>
<button class="px-8 py-2.5 rounded-lg text-on-surface-variant font-medium hover:text-primary transition-colors">Conflictos Evaluación</button></div>
</div>
<!-- Table View -->
<div class="flex flex-col gap-4">
<!-- Card 1 -->
 @for (trabajo of trabajos; track trabajo.id) {
    <app-card-asignar [trabajo]="trabajo"></app-card-asignar>

 }
 
</div>
